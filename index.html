<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-900 text-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#020617" />
  
  <title>Snake 🐍</title>

  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Snake 🐍" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/mqtt@5.3.4/dist/mqtt.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" />

  <style>
    html, body { width: 100%; height: 100%; overscroll-behavior: none; }
    body {
      font-family: 'Inter', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      margin: 0;
      padding: 0;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.3); border-radius: 9999px; }

    .secret-trigger-area {
      position: absolute; top: 0; right: 0; width: 100px; height: 100px; z-index: 50; cursor: default;
    }
  </style>
</head>
<body class="h-full overflow-hidden bg-slate-950 font-sans flex justify-center items-center">

  <!-- Voice Remote Audio Stream Holder -->
  <audio id="remoteAudio" autoplay playsinline></audio>

  <div id="appContainer" class="w-full h-full bg-slate-900 overflow-hidden relative flex flex-col">

    <!-- 1. SNAKE GAME SCREEN -->
    <section id="coverScreen" class="absolute inset-0 z-40 bg-slate-950 flex flex-col p-5 transition-opacity duration-300 select-none">
      <div id="secretHotspot" class="secret-trigger-area"></div>

      <div class="pt-5 flex items-center justify-between pointer-events-none">
        <div>
          <div class="text-xl font-semibold text-slate-100 tracking-tight">Snake</div>
          <div class="text-xs text-slate-500 mt-0.5">Swipe to move</div>
        </div>
        <div class="text-right">
          <div class="text-[10px] uppercase tracking-widest text-slate-500">Score</div>
          <div id="snakeScore" class="text-2xl font-bold text-emerald-400 leading-none">0</div>
        </div>
      </div>

      <div class="flex-1 flex items-center justify-center py-5">
        <div id="snakeGameWrap" class="relative w-[92vw] max-w-[390px] aspect-square rounded-3xl overflow-hidden border border-slate-800 bg-slate-900 shadow-2xl touch-none">
          <canvas id="snakeCanvas" class="w-full h-full block"></canvas>
        </div>
      </div>
    </section>

    <!-- 2. PIN ENTRY SCREEN -->
    <section id="pinScreen" class="absolute inset-0 z-50 bg-slate-950/95 backdrop-blur-md flex flex-col justify-center items-center p-6 hidden">
      <div class="w-full max-w-xs text-center">
        <h2 class="text-xl font-semibold text-slate-100 mb-2">Enter Security Code</h2>
        <div id="pinDots" class="flex justify-center gap-3 mb-8">
          <div class="w-3.5 h-3.5 rounded-full border-2 border-slate-600 bg-transparent"></div>
          <div class="w-3.5 h-3.5 rounded-full border-2 border-slate-600 bg-transparent"></div>
          <div class="w-3.5 h-3.5 rounded-full border-2 border-slate-600 bg-transparent"></div>
          <div class="w-3.5 h-3.5 rounded-full border-2 border-slate-600 bg-transparent"></div>
          <div class="w-3.5 h-3.5 rounded-full border-2 border-slate-600 bg-transparent"></div>
          <div class="w-3.5 h-3.5 rounded-full border-2 border-slate-600 bg-transparent"></div>
        </div>

        <div class="grid grid-cols-3 gap-4 mb-4">
          <button onclick="pressPin('1')" class="h-14 rounded-full bg-slate-900 border border-slate-800 text-xl font-medium text-slate-200">1</button>
          <button onclick="pressPin('2')" class="h-14 rounded-full bg-slate-900 border border-slate-800 text-xl font-medium text-slate-200">2</button>
          <button onclick="pressPin('3')" class="h-14 rounded-full bg-slate-900 border border-slate-800 text-xl font-medium text-slate-200">3</button>
          <button onclick="pressPin('4')" class="h-14 rounded-full bg-slate-900 border border-slate-800 text-xl font-medium text-slate-200">4</button>
          <button onclick="pressPin('5')" class="h-14 rounded-full bg-slate-900 border border-slate-800 text-xl font-medium text-slate-200">5</button>
          <button onclick="pressPin('6')" class="h-14 rounded-full bg-slate-900 border border-slate-800 text-xl font-medium text-slate-200">6</button>
          <button onclick="pressPin('7')" class="h-14 rounded-full bg-slate-900 border border-slate-800 text-xl font-medium text-slate-200">7</button>
          <button onclick="pressPin('8')" class="h-14 rounded-full bg-slate-900 border border-slate-800 text-xl font-medium text-slate-200">8</button>
          <button onclick="pressPin('9')" class="h-14 rounded-full bg-slate-900 border border-slate-800 text-xl font-medium text-slate-200">9</button>
          <button onclick="hidePinPad()" class="h-14 rounded-full text-xs text-slate-500">CANCEL</button>
          <button onclick="pressPin('0')" class="h-14 rounded-full bg-slate-900 border border-slate-800 text-xl font-medium text-slate-200">0</button>
          <button onclick="clearPin()" class="h-14 rounded-full text-slate-400"><i class="fa-solid fa-backspace"></i></button>
        </div>
      </div>
    </section>

    <!-- 3. CHAT SCREEN -->
    <section id="chatScreen" class="flex-1 flex flex-col h-full bg-slate-950 relative hidden">
      <header class="h-16 bg-slate-900/90 border-b border-slate-800 px-4 flex items-center justify-between z-10">
        <div class="flex items-center gap-3">
          <div id="partnerAvatar" class="w-10 h-10 rounded-full bg-sky-600 text-white font-semibold flex items-center justify-center text-sm">U</div>
          <div>
            <h1 id="partnerName" class="font-semibold text-slate-100 text-base leading-snug">Private Contact</h1>
            <span id="partnerStatusText" class="text-xs text-slate-400">Offline</span>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <button onclick="startAudioCall()" class="p-3 text-blue-400 hover:text-blue-300 rounded-full bg-slate-800">
            <i class="fa-solid fa-phone text-lg"></i>
          </button>
        </div>
      </header>

      <main id="messagesContainer" class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-950">
        <!-- Messages Area -->
      </main>

      <footer class="p-3 bg-slate-900 border-t border-slate-800 flex items-center gap-2">
        <input id="messageInput" type="text" placeholder="Type message..." class="flex-1 bg-slate-950 text-slate-100 text-sm border border-slate-800 rounded-full px-4 py-2 focus:outline-none"/>
        <button onclick="sendTextMessage()" class="w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center">
          <i class="fa-solid fa-paper-plane text-sm"></i>
        </button>
      </footer>
    </section>

    <!-- 4. CALL OVERLAY -->
    <section id="callOverlay" class="absolute inset-0 z-50 bg-slate-950 flex flex-col justify-between p-8 text-center hidden">
      <div class="pt-12">
        <div id="callAvatar" class="w-24 h-24 rounded-full bg-sky-600 text-white font-bold flex items-center justify-center text-3xl mx-auto mb-4 ring-4 ring-slate-800">U</div>
        <h2 id="callPartnerName" class="text-2xl font-bold text-slate-100">Private Contact</h2>
        <p id="callStatus" class="text-sm text-sky-400 mt-2">Calling...</p>
      </div>

      <!-- Action Buttons -->
      <div id="incomingCallActions" class="flex justify-center items-center gap-8 pb-10 hidden">
        <button onclick="declineCall()" class="w-16 h-16 rounded-full bg-red-600 text-white text-2xl flex items-center justify-center">
          <i class="fa-solid fa-phone-slash"></i>
        </button>

        <button onclick="acceptCall()" class="w-16 h-16 rounded-full bg-emerald-600 text-white text-2xl flex items-center justify-center animate-pulse">
          <i class="fa-solid fa-phone"></i>
        </button>
      </div>

      <div id="activeCallActions" class="flex justify-center items-center gap-6 pb-10 hidden">
        <button onclick="endCall()" class="w-16 h-16 rounded-full bg-red-600 text-white text-2xl flex items-center justify-center">
          <i class="fa-solid fa-phone-slash"></i>
        </button>
      </div>
    </section>

  </div>

  <script type="module">
    const USER_CONFIG = {
      '101400': { id: 'secret_user_a', name: 'User 1', partnerId: 'secret_user_b' },
      '042000': { id: 'secret_user_b', name: 'User 2', partnerId: 'secret_user_a' }
    };

    let currentUser = null;
    let mqttClient = null;
    let peerConnection = null;
    let localStream = null;
    let pendingOffer = null;
    let pinInput = "";
    let wakeLock = null;
    let isCallActive = false;

    const MQTT_BROKER = 'wss://broker.emqx.io:8084/mqtt';
    const MQTT_TOPIC = 'secret_pair_chat_1014_e2ee/sync';

    const RTC_CONFIG = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'turn:openrelay.metered.ca:80', username: 'openrelay', credential: 'openrelay' },
        { urls: 'turn:openrelay.metered.ca:443', username: 'openrelay', credential: 'openrelay' },
        { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelay', credential: 'openrelay' }
      ]
    };

    // Unlock Mobile Browser Audio restrictions
    function unlockAudioContext() {
      const audio = document.getElementById('remoteAudio');
      if (audio) {
        audio.play().catch(() => {});
      }
    }
    window.addEventListener('click', unlockAudioContext, { once: true });
    window.addEventListener('touchstart', unlockAudioContext, { once: true });

    // BACKGROUND AUDIO KEEP-ALIVE (Prevents call drop when screen is off)
    let audioCtx = null;
    function enableBackgroundAudioKeepAlive() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        gainNode.gain.value = 0.001; // Silent output to prevent OS sleep
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.start();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // REQUEST SCREEN WAKELOCK
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {}
    }

    // PRIVACY AUTO-HIDE: Screen Off / Minimize උන විට Chat එක වසා Snake Game එක පෙන්වයි
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        // Chat screen එක සඟවා Snake Game එක පෙන්වීම (Call එක නතර නොවේ)
        document.getElementById('chatScreen').classList.add('hidden');
        document.getElementById('pinScreen').classList.add('hidden');
        document.getElementById('coverScreen').classList.remove('hidden');
      } else {
        if (isCallActive) {
          requestWakeLock();
        }
      }
    });

    // Secret Pin Trigger
    let taps = 0;
    document.getElementById('secretHotspot').addEventListener('click', () => {
      taps++;
      if (taps >= 4) {
        taps = 0;
        document.getElementById('pinScreen').classList.remove('hidden');
      }
    });

    window.pressPin = (num) => {
      if (pinInput.length < 6) {
        pinInput += num;
        updatePinDots();
      }
      if (pinInput.length === 6) {
        if (USER_CONFIG[pinInput]) {
          currentUser = USER_CONFIG[pinInput];
          document.getElementById('pinScreen').classList.add('hidden');
          document.getElementById('coverScreen').classList.add('hidden');
          document.getElementById('chatScreen').classList.remove('hidden');
          initMQTT();
        } else {
          alert('Invalid Security Code');
          clearPin();
        }
      }
    };

    window.clearPin = () => {
      pinInput = "";
      updatePinDots();
    };

    window.hidePinPad = () => {
      document.getElementById('pinScreen').classList.add('hidden');
      clearPin();
    };

    function updatePinDots() {
      const dots = document.querySelectorAll('#pinDots div');
      dots.forEach((dot, index) => {
        if (index < pinInput.length) {
          dot.classList.add('bg-blue-500', 'border-blue-500');
        } else {
          dot.classList.remove('bg-blue-500', 'border-blue-500');
        }
      });
    }

    // MQTT Real-time Sync & Call Signaling
    function initMQTT() {
      mqttClient = mqtt.connect(MQTT_BROKER, { clientId: 'user_' + currentUser.id + '_' + Math.random().toString(16).slice(2, 8) });

      mqttClient.on('connect', () => {
        mqttClient.subscribe(MQTT_TOPIC);
        sendSignal({ type: 'PRESENCE', senderId: currentUser.id, status: 'ONLINE' });
      });

      mqttClient.on('message', async (topic, payload) => {
        const data = JSON.parse(payload.toString());
        if (data.senderId === currentUser.id) return;

        if (data.type === 'PRESENCE') {
          document.getElementById('partnerStatusText').innerText = "Online";
          document.getElementById('partnerStatusText').className = "text-xs text-emerald-400";
        }

        if (data.type === 'CHAT_MSG') {
          renderSingleMessage(data.msg, false);
        }

        if (data.type === 'CALL_OFFER' && data.targetId === currentUser.id) {
          pendingOffer = data.offer;
          showCallOverlay('Incoming Audio Call...', true);
        }

        if (data.type === 'CALL_ANSWER' && data.targetId === currentUser.id) {
          if (peerConnection) {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
          }
        }

        if (data.type === 'ICE_CANDIDATE' && data.targetId === currentUser.id) {
          if (peerConnection && data.candidate) {
            await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
          }
        }

        if (data.type === 'CALL_DECLINED' || data.type === 'CALL_ENDED') {
          cleanupCall();
        }
      });
    }

    function sendSignal(data) {
      if (mqttClient && mqttClient.connected) {
        mqttClient.publish(MQTT_TOPIC, JSON.stringify(data));
      }
    }

    // WebRTC Audio Engine with Background Keep-Alive
    window.startAudioCall = async () => {
      enableBackgroundAudioKeepAlive();
      requestWakeLock();
      showCallOverlay('Calling...', false);

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        createPeerConnection();

        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);

        sendSignal({
          type: 'CALL_OFFER',
          senderId: currentUser.id,
          targetId: currentUser.partnerId,
          offer: offer
        });
        isCallActive = true;
      } catch (err) {
        alert('Microphone access denied.');
        cleanupCall();
      }
    };

    window.acceptCall = async () => {
      unlockAudioContext();
      enableBackgroundAudioKeepAlive();
      requestWakeLock();

      document.getElementById('incomingCallActions').classList.add('hidden');
      document.getElementById('activeCallActions').classList.remove('hidden');
      document.getElementById('callStatus').innerText = "Connected";

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        createPeerConnection();

        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

        await peerConnection.setRemoteDescription(new RTCSessionDescription(pendingOffer));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);

        sendSignal({
          type: 'CALL_ANSWER',
          senderId: currentUser.id,
          targetId: currentUser.partnerId,
          answer: answer
        });
        isCallActive = true;
      } catch (err) {
        cleanupCall();
      }
    };

    window.declineCall = () => {
      sendSignal({ type: 'CALL_DECLINED', senderId: currentUser.id, targetId: currentUser.partnerId });
      cleanupCall();
    };

    window.endCall = () => {
      sendSignal({ type: 'CALL_ENDED', senderId: currentUser.id, targetId: currentUser.partnerId });
      cleanupCall();
    };

    function createPeerConnection() {
      peerConnection = new RTCPeerConnection(RTC_CONFIG);

      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          sendSignal({
            type: 'ICE_CANDIDATE',
            senderId: currentUser.id,
            targetId: currentUser.partnerId,
            candidate: event.candidate
          });
        }
      };

      peerConnection.ontrack = (event) => {
        const remoteAudio = document.getElementById('remoteAudio');
        if (remoteAudio && event.streams[0]) {
          remoteAudio.srcObject = event.streams[0];
          remoteAudio.play().catch(() => {});
        }
      };
    }

    function showCallOverlay(statusText, isIncoming) {
      document.getElementById('callOverlay').classList.remove('hidden');
      document.getElementById('callStatus').innerText = statusText;

      if (isIncoming) {
        document.getElementById('incomingCallActions').classList.remove('hidden');
        document.getElementById('activeCallActions').classList.add('hidden');
      } else {
        document.getElementById('incomingCallActions').classList.add('hidden');
        document.getElementById('activeCallActions').classList.remove('hidden');
      }
    }

    function cleanupCall() {
      isCallActive = false;
      if (wakeLock) {
        wakeLock.release().catch(() => {});
        wakeLock = null;
      }
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }
      const remoteAudio = document.getElementById('remoteAudio');
      if (remoteAudio) remoteAudio.srcObject = null;

      document.getElementById('callOverlay').classList.add('hidden');
    }

    // Text Chat Messaging
    window.sendTextMessage = () => {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text || !currentUser) return;

      const msgObj = { text: text, senderId: currentUser.id, timestamp: Date.now() };
      renderSingleMessage(msgObj, true);
      sendSignal({ type: 'CHAT_MSG', senderId: currentUser.id, msg: msgObj });
      input.value = "";
    };

    function renderSingleMessage(msg, isMine) {
      const container = document.getElementById('messagesContainer');
      const div = document.createElement('div');
      div.className = `flex ${isMine ? 'justify-end' : 'justify-start'}`;
      div.innerHTML = `
        <div class="max-w-[75%] px-4 py-2 rounded-2xl text-sm ${isMine ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-200'}">
          ${msg.text}
        </div>
      `;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }
  </script>
</body>
</html>
