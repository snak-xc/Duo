<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>Phone Call — Web App</title>
  <script src="https://unpkg.com/mqtt@5.3.4/dist/mqtt.min.js"></script>
  <style>
    :root{color-scheme:dark;--bg:#07111f;--panel:#101e31;--muted:#9aaec6;--line:#263950;--green:#45dfa0;--blue:#70b7ff;--red:#ff6474}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -15%,#1b4161 0,transparent 50%),var(--bg);color:#f4f8ff;font:16px system-ui,-apple-system,sans-serif;display:flex;justify-content:center}
    button,input,select{font:inherit}button{border:0;cursor:pointer;color:inherit}.shell{width:min(100%,520px);padding:env(safe-area-inset-top) 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;min-height:100vh}
    header{display:flex;justify-content:center;align-items:center;gap:12px;padding:28px 0 24px}.logo{width:54px;height:54px;border-radius:18px;background:linear-gradient(145deg,#58e4ab,#2581ed);display:grid;place-items:center;font-size:27px;box-shadow:0 8px 30px #168c8a55}.brand{font-weight:750;font-size:19px;letter-spacing:.2px}.subbrand{font-size:12px;color:var(--muted);margin-top:1px}.top-phone{display:flex;align-items:center;justify-content:center}.entry-card{width:min(100%,400px);margin:auto;padding:24px}.code-row{display:flex;gap:10px;align-items:center;justify-content:center}.code-row .input{text-align:center;min-height:60px;font-size:23px;letter-spacing:5px;text-transform:uppercase}.new-key{width:60px;height:60px;flex:0 0 60px;border-radius:18px;background:#1d3047;border:1px solid #314861;font-size:25px}.entry-join{width:100%;height:58px;margin-top:12px;border-radius:16px;background:linear-gradient(100deg,#37d994,#19a8c5);font-weight:800;color:#061921;box-shadow:0 8px 24px #16c38a24}.shell{justify-content:flex-start}
    .card{background:linear-gradient(145deg,#122238f2,#0c1929f5);border:1px solid #243950;border-radius:24px;padding:22px;box-shadow:0 16px 50px #0003}.intro{margin:0 0 18px;font-size:25px;line-height:1.25}.hint{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 19px}.field{display:block;color:#bdcde0;font-size:13px;margin:15px 0 7px}.input{display:block;width:100%;border:1px solid #314861;background:#081523;color:white;border-radius:14px;padding:14px 15px;outline:none}.input:focus{border-color:#58c6ff;box-shadow:0 0 0 3px #58c6ff20}.code-row{display:flex;gap:9px}.code-row .input{min-width:0;letter-spacing:2px;font-weight:700}.icon-button{width:50px;border-radius:14px;background:#1d3047;border:1px solid #314861}.primary{width:100%;padding:15px;border-radius:15px;background:linear-gradient(100deg,#37d994,#19a8c5);font-weight:800;color:#061921;margin-top:19px;box-shadow:0 8px 24px #16c38a24}.primary:disabled{opacity:.45;cursor:default}.divider{display:flex;align-items:center;gap:12px;color:#7086a0;font-size:12px;margin:19px 0}.divider:before,.divider:after{content:"";height:1px;background:#2a3d53;flex:1}.fine{font-size:11px;color:#8297af;line-height:1.55;margin:18px 0 0}
    .statusline{display:flex;align-items:center;gap:9px;color:#c4d3e5;font-size:13px;margin:2px 0 16px}.dot{width:9px;height:9px;border-radius:50%;background:#708197;box-shadow:0 0 0 4px #70819718}.dot.ok{background:var(--green);box-shadow:0 0 0 4px #45dfa022}.dot.warn{background:#ffc061;box-shadow:0 0 0 4px #ffc06122}.person{display:flex;align-items:center;flex-direction:column;text-align:center;padding:22px 0 26px}.avatar{width:112px;height:112px;border-radius:50%;background:linear-gradient(145deg,#285c77,#17304d);display:grid;place-items:center;font-size:42px;margin-bottom:16px;box-shadow:0 0 0 9px #ffffff08,0 18px 48px #0005}.person-name{font-size:23px;font-weight:750}.calltime{font-size:14px;color:var(--muted);margin-top:5px}.room-chip{margin-top:15px;padding:8px 13px;border-radius:20px;background:#152a40;color:#bad0e8;font-size:12px;letter-spacing:1px}.controls{display:flex;justify-content:center;gap:18px;padding:8px 0 18px}.control{display:flex;flex-direction:column;align-items:center;gap:8px;background:transparent;color:#bfcede;font-size:11px;min-width:66px}.control .circle{width:58px;height:58px;border-radius:50%;background:#203148;display:grid;place-items:center;font-size:22px;border:1px solid #344a63}.control.active .circle{background:#27614d;border-color:#3da879}.control.end .circle{background:#ef4759;color:white;border:0;width:64px;height:64px;font-size:25px}.route-wrap{display:flex;align-items:center;gap:10px;padding:12px 13px;background:#091726;border:1px solid #23374d;border-radius:14px;margin-top:4px}.route-wrap label{font-size:12px;color:#adc0d5;white-space:nowrap}.route-wrap select{background:transparent;border:0;color:white;width:100%;min-width:0;outline:none;font-size:13px}.route-wrap option{color:#111}.volume{width:100%;accent-color:#56dca1}.notice{padding:12px 14px;border:1px solid #735d30;background:#29261d;border-radius:14px;color:#eed28d;font-size:12px;line-height:1.5;margin-top:16px}.secondary{background:#1c3047;padding:12px;border-radius:13px;color:#caddf0;font-size:13px}.link-btn{background:transparent;color:#77c7ff;font-size:13px;padding:10px}.incoming-actions{display:flex;gap:12px;margin-top:12px}.incoming-actions button{flex:1;padding:14px;border-radius:15px;font-weight:750}.accept{background:#24bd7d;color:#052417}.decline{background:#42303a;color:#ffdfe3}.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:calc(25px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#f0f6ff;color:#102036;padding:12px 17px;border-radius:14px;box-shadow:0 8px 30px #0006;font-size:13px;transition:.2s;z-index:10;max-width:90vw;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}footer{margin-top:auto;padding:18px 3px 0;text-align:center;color:#71859e;font-size:11px;line-height:1.55}.pulse{animation:pulse 1.5s infinite}@keyframes pulse{50%{box-shadow:0 0 0 18px #45dfa000,0 0 0 9px #45dfa018}}
  </style>
</head>
<body>
<main class="shell">
  <header class="top-phone" aria-label="Phone call"><div class="logo" aria-hidden="true">☎</div></header>

  <section id="home" class="card entry-card">
    <div class="code-row"><input class="input" id="room" maxlength="12" autocomplete="off" autocapitalize="characters" placeholder="Enter room key" aria-label="Room key"><button id="generate" class="new-key" aria-label="Generate random room key" title="New key">↻</button></div>
    <button id="join" class="entry-join" aria-label="Join room">☎ &nbsp; Join</button>
  </section>

  <section id="roomPanel" class="card hidden">
    <div class="statusline"><span id="statusDot" class="dot"></span><span id="statusText">Connecting…</span></div>
    <div class="person"><div id="avatar" class="avatar">☎</div><div id="partnerName" class="person-name">Waiting</div><div id="callTime" class="calltime">—</div><div class="room-chip"><b id="roomLabel"></b></div></div>
    <div id="waitingActions"><button id="call" class="primary" disabled>☎ &nbsp; Call</button><button id="copyRoom" class="secondary" style="width:100%;margin-top:10px" aria-label="Copy room key">Copy key</button></div>
    <div id="incomingBox" class="hidden"><div class="incoming-actions"><button id="decline" class="decline" aria-label="Decline">✕ &nbsp; Decline</button><button id="accept" class="accept" aria-label="Accept">☎ &nbsp; Accept</button></div></div>
    <div id="activeBox" class="hidden">
      <div class="controls">
        <button id="mute" class="control"><span class="circle">🎙️</span><span>Mute</span></button>
        <button id="hangup" class="control end"><span class="circle">📞</span><span>End</span></button>
      </div>
      <div class="route-wrap"><label for="route">Output</label><select id="route"><option value="">Default</option></select></div>
      <label class="field" for="volume">Volume</label><input class="volume" id="volume" type="range" min="0" max="1" step="0.05" value="1">
    </div>
    <button id="leave" class="link-btn" style="display:block;margin:12px auto 0" aria-label="Leave room">Leave room</button>
  </section>

</main>
<audio id="remoteAudio" autoplay playsinline></audio>
<div id="toast" class="toast"></div>

<script>
(()=>{
  'use strict';
  const $=id=>document.getElementById(id);
  const state={client:null,room:'',id:crypto.randomUUID(),peer:null,peerId:'',peerName:'Phone',lastPeerSeen:0,stream:null,remoteStream:null,offer:null,iceQueue:[],incoming:false,active:false,muted:false,startedAt:0,timer:null,wake:null,connecting:false,audioContext:null,audioGain:null,audioSource:null,audioDestination:null};
  const broker='wss://broker.emqx.io:8084/mqtt';
  const roomInput=$('room');
  function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800)}
  function status(msg,kind=''){ $('statusText').textContent=msg; $('statusDot').className='dot '+kind; }
  function makeCode(){const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<6;i++)s+=chars[Math.floor(Math.random()*chars.length)];return s}
  roomInput.value=makeCode();
  $('generate').onclick=()=>{roomInput.value=makeCode()};
  roomInput.addEventListener('input',()=>roomInput.value=roomInput.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,12));
  const topic=()=>`phone-call-demo/v1/${state.room}`;
  function send(type,payload={}){if(!state.client||!state.client.connected)return;state.client.publish(topic(),JSON.stringify({type,from:state.id,to:state.peerId||'',at:Date.now(),...payload}),{qos:1,retain:false})}
  function setPeer(_name,id){state.peerName='Phone';state.peerId=id;state.lastPeerSeen=Date.now();$('partnerName').textContent=state.peerName;$('avatar').textContent='☎';$('call').disabled=false;status('Phone connected','ok')}
  function startRoom(){
    if(typeof mqtt==='undefined'){toast('Connection service unavailable');return}
    state.client=mqtt.connect(broker,{clientId:'pc_'+state.id.replaceAll('-','').slice(0,20),clean:true,connectTimeout:12000,reconnectPeriod:2500,keepalive:25,protocolVersion:4});
    state.client.on('connect',()=>{state.client.subscribe(topic(),{qos:1});status('Waiting for phone','ok');state.client.publish(topic(),JSON.stringify({type:'HELLO',from:state.id,at:Date.now()}),{qos:1,retain:false});if(state.helloTimer)clearInterval(state.helloTimer);state.helloTimer=setInterval(()=>{if(state.client?.connected)state.client.publish(topic(),JSON.stringify({type:'HELLO',from:state.id,at:Date.now()}),{qos:1,retain:false});if(state.peerId&&Date.now()-state.lastPeerSeen>30000&&!state.active&&!state.incoming){state.peerId='';$('call').disabled=true;status('Phone disconnected','warn')}},10000)});
    state.client.on('reconnect',()=>status('Reconnecting…','warn'));
    state.client.on('offline',()=>status('Network unavailable','warn'));
    state.client.on('error',e=>{console.error(e);status('Connection issue','warn')});
    state.client.on('message',async(_t,buf)=>{let m;try{m=JSON.parse(buf.toString())}catch{return}if(m.from===state.id)return;if(m.at&&Date.now()-m.at>90000)return;if(m.type==='HELLO'){setPeer('',m.from);send('HELLO_ACK',{to:m.from})}else if(m.type==='HELLO_ACK'){setPeer('',m.from)}else if(m.to&&m.to!==state.id)return;else if(m.type==='CALL'){setPeer('',m.from);if(state.active)return;state.offer=m.offer;state.peerId=m.from;state.incoming=true;$('waitingActions').classList.add('hidden');$('incomingBox').classList.remove('hidden');$('callTime').textContent='Incoming call';status('Incoming call','ok');ring(true)}else if(m.type==='ANSWER'){if(state.peer&&m.answer){await state.peer.setRemoteDescription(m.answer);await flushIce();connectUi()}}else if(m.type==='ICE'&&m.candidate){if(state.peer&&state.peer.remoteDescription){try{await state.peer.addIceCandidate(m.candidate)}catch(e){console.warn(e)}}else state.iceQueue.push(m.candidate)}else if(m.type==='END'){toast('Call ended');cleanupCall(false)} });
  }
  $('join').onclick=()=>{const room=roomInput.value.trim();if(room.length<4){toast('Enter a room key');roomInput.focus();return}state.room=room;$('roomLabel').textContent=room;$('home').classList.add('hidden');$('roomPanel').classList.remove('hidden');startRoom()};
  $('copyRoom').onclick=async()=>{try{await navigator.clipboard.writeText(state.room);toast('Room key copied')}catch{toast(state.room)}};
  function ring(on){if(!on){if(state.ringTimer)clearInterval(state.ringTimer);return}const beep=()=>{try{const c=new (window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator(),g=c.createGain();o.frequency.value=440;g.gain.value=.06;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.22);o.onended=()=>c.close()}catch{}};beep();state.ringTimer=setInterval(beep,1600)}
  async function prepareAudio(){if(!window.AudioContext)return;if(!state.audioContext)state.audioContext=new AudioContext();if(state.audioContext.state==='suspended')await state.audioContext.resume()}
  async function getMedia(){return navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false})}
  function attachRemoteAudio(stream){state.remoteStream=stream;const audio=$('remoteAudio');audio.muted=false;audio.volume=1;try{if(state.audioContext){state.audioSource=state.audioContext.createMediaStreamSource(stream);state.audioGain=state.audioContext.createGain();state.audioDestination=state.audioContext.createMediaStreamDestination();state.audioGain.gain.value=Number($('volume').value);state.audioSource.connect(state.audioGain);state.audioGain.connect(state.audioDestination);audio.srcObject=state.audioDestination.stream;state.audioContext.resume().catch(()=>{})}else audio.srcObject=stream}catch(e){console.warn('Web Audio gain unavailable',e);audio.srcObject=stream}audio.play().catch(()=>toast('Tap the screen to enable call audio'));populateRoutes()}
  function createPeer(){const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'turn:openrelay.metered.ca:80',username:'openrelay',credential:'openrelay'},{urls:'turn:openrelay.metered.ca:443',username:'openrelay',credential:'openrelay'},{urls:'turn:openrelay.metered.ca:443?transport=tcp',username:'openrelay',credential:'openrelay'}],iceCandidatePoolSize:6});state.peer=pc;state.stream.getTracks().forEach(t=>pc.addTrack(t,state.stream));pc.ontrack=e=>attachRemoteAudio(e.streams[0]||new MediaStream([e.track]));pc.onicecandidate=e=>{if(e.candidate)send('ICE',{to:state.peerId,candidate:e.candidate})};pc.onconnectionstatechange=()=>{if(pc.connectionState==='connected'){connectUi()}else if(pc.connectionState==='failed'){status('Connection failed','warn')}else if(pc.connectionState==='disconnected'){status('Reconnecting…','warn')}};return pc}
  async function flushIce(){while(state.iceQueue.length&&state.peer?.remoteDescription){const c=state.iceQueue.shift();try{await state.peer.addIceCandidate(c)}catch(e){console.warn(e)}}}
  async function placeCall(){if(!state.peerId){toast('Phone is not connected');return}state.connecting=true;try{await prepareAudio();state.stream=await getMedia();const pc=createPeer();const offer=await pc.createOffer();await pc.setLocalDescription(offer);send('CALL',{to:state.peerId,offer:pc.localDescription});$('waitingActions').classList.add('hidden');$('activeBox').classList.remove('hidden');$('callTime').textContent='Connecting…';status('Calling…','warn');await requestWake()}catch(e){console.error(e);toast(e.name==='NotAllowedError'?'Allow microphone access':'Microphone unavailable');cleanupCall(false)}finally{state.connecting=false}}
  $('call').onclick=placeCall;
  $('accept').onclick=async()=>{ring(false);try{await requestWake();await prepareAudio();state.stream=await getMedia();const pc=createPeer();await pc.setRemoteDescription(state.offer);await flushIce();const answer=await pc.createAnswer();await pc.setLocalDescription(answer);send('ANSWER',{to:state.peerId,answer:pc.localDescription});state.incoming=false;$('incomingBox').classList.add('hidden');$('activeBox').classList.remove('hidden');status('Connecting…','warn')}catch(e){console.error(e);toast('Allow microphone access');cleanupCall(false)}};
  $('decline').onclick=()=>{ring(false);send('END',{to:state.peerId});cleanupCall(true)};
  function connectUi(){if(!state.peer||state.peer.connectionState!=='connected')return;state.active=true;state.startedAt=Date.now();$('callTime').textContent='00:00';status('Connected','ok');$('avatar').classList.add('pulse');if(state.timer)clearInterval(state.timer);state.timer=setInterval(()=>{const sec=Math.floor((Date.now()-state.startedAt)/1000);$('callTime').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')},1000);populateRoutes()}
  async function requestWake(){try{if('wakeLock'in navigator){state.wake=await navigator.wakeLock.request('screen');state.wake.addEventListener('release',()=>{state.wake=null})}}catch(e){console.info('Wake lock unavailable',e)}}
  async function populateRoutes(){const select=$('route');if(select.options.length>1)return;try{const devices=await navigator.mediaDevices.enumerateDevices();const outputs=devices.filter(d=>d.kind==='audiooutput');for(const d of outputs){const o=document.createElement('option');o.value=d.deviceId;o.textContent=d.label||'Audio output';select.appendChild(o)}}catch(e){}}
  $('route').onchange=async e=>{try{if(typeof $('remoteAudio').setSinkId!=='function')throw new Error('unsupported');if(!e.target.value&&navigator.mediaDevices.selectAudioOutput){const d=await navigator.mediaDevices.selectAudioOutput();if(d?.deviceId){await $('remoteAudio').setSinkId(d.deviceId);e.target.value=d.deviceId;return}}await $('remoteAudio').setSinkId(e.target.value)}catch(err){toast('Output selection is unavailable')}};
  $('volume').oninput=e=>{const value=Number(e.target.value);if(state.audioGain&&state.audioContext)state.audioGain.gain.setTargetAtTime(value,state.audioContext.currentTime,.01);$('remoteAudio').volume=state.audioGain?1:value};
  $('mute').onclick=()=>{state.muted=!state.muted;state.stream?.getAudioTracks().forEach(t=>t.enabled=!state.muted);$('mute').classList.toggle('active',state.muted);$('mute').querySelector('span:last-child').textContent=state.muted?'Unmute':'Mute';$('mute').querySelector('.circle').textContent=state.muted?'🔇':'🎙️'};
  function cleanupCall(fromLocal){ring(false);if(fromLocal&&state.client?.connected)send('END',{to:state.peerId});if(state.timer)clearInterval(state.timer);state.timer=null;state.active=false;state.incoming=false;state.offer=null;state.iceQueue=[];state.peer?.close();state.peer=null;state.audioSource?.disconnect();state.audioGain?.disconnect();state.audioSource=null;state.audioGain=null;state.audioDestination=null;state.audioContext?.close().catch(()=>{});state.audioContext=null;state.stream?.getTracks().forEach(t=>t.stop());state.stream=null;$('remoteAudio').srcObject=null;$('avatar').classList.remove('pulse');$('activeBox').classList.add('hidden');$('incomingBox').classList.add('hidden');$('waitingActions').classList.remove('hidden');$('callTime').textContent='—';if(state.wake){state.wake.release().catch(()=>{});state.wake=null}if(state.peerId)status('Call ended','ok')}
  $('hangup').onclick=()=>cleanupCall(true);
  $('leave').onclick=()=>{cleanupCall(true);if(state.helloTimer)clearInterval(state.helloTimer);state.helloTimer=null;if(state.client){state.client.end(true);state.client=null}state.peerId='';state.room='';$('roomPanel').classList.add('hidden');$('home').classList.remove('hidden')};
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&state.active)requestWake()});
  window.addEventListener('pagehide',()=>{if(state.client)state.client.end(true)});
})();
</script>
</body>
</html>
